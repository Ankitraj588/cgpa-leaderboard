{% extends "layout.html" %}

{% block body %}

<div class="card form-card p-4 mt-4 w-50 mx-auto text-center">

  <h3>Reset Password</h3>
  <p class="text-light">Enter your Registration Number and New Password</p>

  <form method="POST">

    <input type="text" name="reg" class="form-control mb-3" placeholder="Registration Number" required>

    <input type="password" name="password" class="form-control mb-3" placeholder="New Password" required>

    <button class="btn btn-warning w-100">Reset Password</button>
  </form>

</div>

{% endblock %}
