{% extends "layout.html" %}
{% block body %}
<div class="card form-card p-4 mt-4 mx-auto text-center">
  <h3>Set a new password</h3>
  <p class="text-light">At least 8 characters</p>
  <form method="POST">
    <input type="password" name="password" class="form-control mb-3"
           placeholder="New password" autocomplete="new-password" minlength="8" required>
    <input type="password" name="confirm" class="form-control mb-3"
           placeholder="Confirm new password" autocomplete="new-password" minlength="8" required>
    <button class="btn btn-primary w-100">Update password</button>
  </form>
</div>
{% endblock %}
